<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TravelNest – Share your feedback and explore our FAQ" />
  <meta name="theme-color" content="#1a6b5e" />
  <title>Feedback – TravelNest</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">✈</span>
        TravelNest
      </a>
      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="destinations.html">Destinations</a>
        <a href="planner.html">Planner</a>
        <a href="mood.html">Mood</a>
        <a href="feedback.html">Feedback</a>
        <a href="planner.html" class="nav-cta">Plan Trip</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </header>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <span class="header-eyebrow">We'd Love to Hear From You</span>
    <h1>Feedback &amp; FAQ</h1>
    <p>Share your thoughts or find answers to common questions below.</p>
  </div>

  <!-- MAIN -->
  <main>
    <div class="section-container">
      <div class="feedback-grid">

        <!-- ── FEEDBACK FORM ── -->
        <div class="feedback-card">
          <h2> Send Feedback</h2>

          <form id="feedbackForm" novalidate autocomplete="off">

            <div class="form-group" id="fg-name">
              <label for="fbName">Full Name</label>
              <input
                type="text"
                id="fbName"
                name="name"
                placeholder="Jane Smith"
                autocomplete="name"
              />
              <span class="field-error" id="err-name"></span>
            </div>

            <div class="form-group" id="fg-email">
              <label for="fbEmail">Email Address</label>
              <input
                type="text"
                id="fbEmail"
                name="email"
                placeholder="jane@example.com"
                autocomplete="email"
              />
              <span class="field-error" id="err-email"></span>
            </div>

            <div class="form-group" id="fg-subject">
              <label for="fbSubject">Subject</label>
              <select id="fbSubject" name="subject">
                <option value="">— Select a topic —</option>
                <option value="General Enquiry">General Enquiry</option>
                <option value="Destination Suggestion">Destination Suggestion</option>
                <option value="Bug Report">Bug Report</option>
                <option value="Partnership">Partnership</option>
                <option value="Other">Other</option>
              </select>
              <span class="field-error" id="err-subject"></span>
            </div>

            <div class="form-group" id="fg-message">
              <label for="fbMessage">Message</label>
              <textarea
                id="fbMessage"
                name="message"
                rows="5"
                placeholder="Tell us what you think…"
              ></textarea>
              <span class="field-error" id="err-message"></span>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%">
              Send Message →
            </button>

          </form>

          <div class="form-success" id="formSuccess" role="alert">
            <span class="success-icon">✅</span>
            <div>
              <strong>Thank you!</strong> Your message has been received. We'll be in touch soon.
            </div>
          </div>

          <!-- Previous submissions count -->
          <p id="submissionCount" style="margin-top:.75rem;font-size:.8rem;color:var(--text-light);"></p>
        </div>

        <!-- ── FAQ ── -->
        <div class="feedback-card">
          <h2> FAQ</h2>

          <ul class="faq-list" id="faqList" role="list">
            <!-- Populated by JS -->
          </ul>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer-simple">
    <p><a href="index.html">TravelNest</a> &nbsp;·&nbsp; © <span id="year"></span> All rights reserved.</p>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/feedback.js"></script>
</body>
</html>
